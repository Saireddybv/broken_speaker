<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07110d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Audio Bridge</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="eyebrow">LOCAL AUDIO RELAY</p>
        <h1>Laptop sound,<br /><em>right here.</em></h1>
        <p class="lede">Keep this page open while your laptop sends audio over your Wi-Fi.</p>
      </header>

      <section class="player" aria-labelledby="connection-heading">
        <div class="status-line">
          <span class="status-dot" id="status-dot"></span>
          <div>
            <p class="label" id="connection-heading">Connection</p>
            <p class="value" id="status-text">Ready to connect</p>
          </div>
          <span class="latency" id="buffer-label">—</span>
        </div>

        <canvas id="meter" width="640" height="110" aria-label="Audio level visualization"></canvas>

        <button id="listen-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <span>Start listening</span>
        </button>

        <div class="volume-row">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.5-2.87v5.74A3.5 3.5 0 0 0 15.5 12z" /></svg>
          <input id="volume" type="range" min="0" max="1.5" value="1" step="0.05" aria-label="Volume" />
          <output id="volume-label">100%</output>
        </div>
      </section>

      <aside>
        <p><strong>Tip</strong> Plug headphones into your iPhone for private listening. Keep the phone awake for uninterrupted audio.</p>
      </aside>

      <footer><span id="device-name">Windows system audio</span><span>Same Wi-Fi only</span></footer>
    </main>
    <script src="/static/player.js"></script>
  </body>
</html>
